name: device_detector
version: 1.5.0

authors:
  - creadone <creadone@gmail.com>
  - delef <delef@ya.ru>

description: |
  Fast User-Agent detection for Crystal, available as a shard and a parallel
  JSONL command-line tool. Detects browsers, operating systems, bots,
  applications, device types, vendors, and models.

crystal: ">= 1.21.0, < 2.0.0"
license: MIT

targets:
  device-detector:
    main: src/device_detector_cli.cr

executables:
  - device-detector

dependencies:
  baked_file_system:
    github: creadone/baked_file_system

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: ~> 1.6.4
